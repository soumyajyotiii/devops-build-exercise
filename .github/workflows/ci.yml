name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ${{ vars.ECR_REGISTRY }}
  IMAGE_NAME: underwriting-agent

permissions:
  contents: read
  id-token: write       # needed for OIDC → AWS
  pull-requests: write   # PR comments

jobs:
  # ──────────────────────────────────────────
  # lint + type check
  # ──────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: install dev deps
        run: pip install -e ".[dev]"

      - name: ruff lint
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

  # ──────────────────────────────────────────
  # unit / smoke tests
  # ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      LLM_PROVIDER: mock
      DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test"
      S3_BUCKET: test-bucket
      ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: install deps
        run: pip install -e ".[dev]"

      - name: run tests
        run: pytest tests/ -v --tb=short

  # ──────────────────────────────────────────
  # docker build + push (main branch only)
  # ──────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: set image metadata
        id: meta
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHA}" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.latest_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.full_image }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ──────────────────────────────────────────
  # deploy to dev (auto on main push)
  # ──────────────────────────────────────────
  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: setup kubectl
        uses: azure/setup-kubectl@v4

      - name: update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: deploy to dev
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          cd k8s
          kustomize edit set image underwriting-agent=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}
          kubectl apply -k overlays/dev
          kubectl -n underwriting-agent rollout status deployment/underwriting-agent --timeout=120s

  # ──────────────────────────────────────────
  # deploy to staging (manual trigger)
  # ──────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: setup kubectl
        uses: azure/setup-kubectl@v4

      - name: update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: deploy to staging
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          cd k8s
          kustomize edit set image underwriting-agent=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}
          kubectl apply -k overlays/staging
          kubectl -n underwriting-agent rollout status deployment/underwriting-agent --timeout=120s

  # ──────────────────────────────────────────
  # deploy to prod (manual approval required)
  # ──────────────────────────────────────────
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: setup kubectl
        uses: azure/setup-kubectl@v4

      - name: update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}

      - name: deploy to production
        run: |
          SHA=$(echo ${{ github.sha }} | cut -c1-7)
          cd k8s
          kustomize edit set image underwriting-agent=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}
          kubectl apply -k overlays/prod
          kubectl -n underwriting-agent rollout status deployment/underwriting-agent --timeout=180s

      - name: verify deployment health
        run: |
          sleep 10
          kubectl -n underwriting-agent exec deploy/underwriting-agent -- curl -sf http://localhost:8080/healthz
          echo "healthcheck passed"
