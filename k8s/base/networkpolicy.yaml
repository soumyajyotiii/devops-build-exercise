apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: underwriting-agent
  namespace: underwriting-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: underwriting-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # allow traffic from ALB / ingress controller only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS outbound (anthropic API, S3, SES, secrets manager)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # postgres
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
